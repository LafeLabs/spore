<!doctype html>
<html lang="en">
<head>
   <meta charset="utf-8">
   <!--
spore stack
   -->
  <link href="data:image/x-icon;base64,AAABAAEAEBAQAAEABAAoAQAAFgAAACgAAAAQAAAAIAAAAAEABAAAAAAAgAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB/3gAA//8AAPb/AAD//wAA//8AAP/7AAD/3wAA3/8AAP7/AAD//wAA//8AAP93AADv/wAA//8AAP//AAB+/gAA" rel="icon" type="image/x-icon">
  <title>feed editor</title>  
  <script src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>   
</head>
<body>
    <a id = "homelink" href=  "index.html">index.html</a>
    <table>
        <tr>
            <td>CREATE:</td>
            <td>
                <input id = "new-link">
            </td>
        </tr>
    </table>
    <div id = "feed"></div>
<script>

document.getElementById("new-link").value = "";

document.getElementById("new-link").select();

document.getElementById("new-link").onchange = function(){
    let newLink = {};
    newLink.href = this.value;
    newLink.innerHTML = this.value;
    this.value = "";
    feed.unshift(newLink);
    drawFeed();
    data = encodeURIComponent(JSON.stringify(feed,null,"    "));
    fetch('save-file.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=utf-8' },
        body: 'data=' + data + '&filename=feed.json'
    });    
    
    
}

feed = [];
var httpc = new XMLHttpRequest();
httpc.onreadystatechange = function() {
    if (this.readyState == 4 && this.status == 200) {
        feed = JSON.parse(this.responseText);
        drawFeed();
    }
};
httpc.open("GET", "load-file.php?filename=feed.json", true);
httpc.send()


function drawFeed(){
    document.getElementById("feed").innerHTML = "";
    for(let index = 0;index < feed.length;index++){
        var newspan = document.createElement("SPAN");
        newspan.innerHTML = feed[index].href;
        newspan.className = "link";
        newspan.name = feed[index].href;
        document.getElementById("feed").appendChild(newspan);
        var deleteButton = document.createElement("SPAN");
        deleteButton.innerHTML = "DESTROY";
        deleteButton.className = "destroy";
        newspan.appendChild(deleteButton);
        deleteButton.onclick = function(){
            destroyLink = this.parentElement.name; 
            let newFeed = [];
            for(let index = 0;index < feed.length;index++){
                if(feed[index].href != destroyLink){
                    newFeed.push(feed[index]);
                }
            }
            feed = newFeed;
            drawFeed();
            data = encodeURIComponent(JSON.stringify(feed,null,"    "));
            fetch('save-file.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=utf-8' },
                body: 'data=' + data + '&filename=feed.json'
            });
            
        }
    }
}

</script>
<style>

.destroy{
    color:red;
    border:solid;
    border-color:red;
    border-width:4px;
    border-radius:10px;
    cursor:pointer;
}
.destroy:hover{
    background-color:#ff000080;
}
#homelink {
    color:blue;
    font-size:2em;
}
table{
    font-size:2em;
}
input{
    background-color:black;
    color:#00ff00;
    font-family:courier;
    font-size:1em;
}

#feed {
  font-family: Comic Sans MS;
  background-color: #9f8767;
  box-sizing: border-box;
  border-radius: 0.5em;
  padding: 0.5em;
  position: absolute;
    border:solid;

  top: max(180px, 25vw);
  left: 10px;
  bottom: 10px;
  right: 10px;
  font-size: clamp(1.2em, 4vw, 3em);
    overflow:scroll;

}


.link{
    text-align:center;
    font-size:2em;
    width:80%;
    margin:auto;
    display:block;
    border:solid;
    color:blue;
    border-radius:0.5em;
    border-width:0.1em;
    margin-top:1em;
    margin-bottom:0.5em;
    overflow-x:scroll;

}
body {
  background-color: #9f8767;
  font-family:  Comic Sans MS;
}

@media (min-width: 768px) {
  #sign {
    top: 180px;
    font-size: 3em;
  }
  #stack {
    top: 180px;
    font-size: 3em;
  }
  #feed {
    top: 180px;
    font-size: 3em;
  }
    
}
</style>
</body>
</html>
