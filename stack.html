<!doctype html>
<html lang="en">
<head>
   <meta charset="utf-8">
   <!--
spore stack
   -->
  <link href="data:image/x-icon;base64,AAABAAEAEBAQAAEABAAoAQAAFgAAACgAAAAQAAAAIAAAAAEABAAAAAAAgAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB/3gAA//8AAPb/AAD//wAA//8AAP/7AAD/3wAA3/8AAP7/AAD//wAA//8AAP93AADv/wAA//8AAP//AAB+/gAA" rel="icon" type="image/x-icon">
  <title>stack editor</title>  
  <script src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>   
</head>
<body>
    <a id = "homelink" href=  "index.html">index.html</a>
    <table>
        <tr>
            <td>CREATE:</td>
            <td>
                <input id = "new-element">
            </td>
        </tr>
    </table>
    <div id = "stack"></div>
<script>

document.getElementById("new-element").value = "";
document.getElementById("new-element").select();
document.getElementById("new-element").onchange = function(){
    newFile = this.value;
    if(newFile.slice(-4) != ".txt"){
        newFile += ".txt";
    }
    //save file with name newfile and content this.value
    data = encodeURIComponent(this.value);
    var httpc = new XMLHttpRequest();
    var url = "save-file.php";        
    httpc.open("POST", url, true);
    httpc.setRequestHeader("Content-Type", "application/x-www-form-urlencoded;charset=utf-8");
    httpc.send("data="+data+"&filename="+newFile);//send text to save-file.php
    loadStack();
    this.value= "";
}

loadStack();

function loadStack(){
    fetch('list-files.php')
    .then(xhr => xhr.json())
    .then(files => {
        document.getElementById("stack").innerHTML = "";
        for (var index = 0; index < files.length; index++) {
            if (files[index].substring(files[index].length - 4, files[index].length) == ".txt") {
                var newspan = document.createElement("span");
                newspan.className = "element";
                newspan.innerHTML = files[index].split(".txt")[0];
                document.getElementById("stack").appendChild(newspan);
                newspan.name = files[index];
                var deleteButton = document.createElement("SPAN");
                deleteButton.innerHTML = "DESTROY";
                deleteButton.className = "destroy";
                newspan.appendChild(deleteButton);
                deleteButton.onclick = function(){
                    destroyLink = this.parentElement.name; 
                    var httpc = new XMLHttpRequest();
                    var url = "delete-file.php";         
                    httpc.open("POST", url, true);
                    httpc.setRequestHeader("Content-Type", "application/x-www-form-urlencoded;charset=utf-8");
                    httpc.send("filename=" + destroyLink);//send text to deletefile.php
                    loadStack();
                    
                }
            }
        }
    });
    
}





</script>
<style>

.destroy{
    color:red;
    border:solid;
    border-color:red;
    border-width:4px;
    border-radius:10px;
    cursor:pointer;
}
.destroy:hover{
    background-color:#ff000080;
}
#homelink {
    color:blue;
    font-size:2em;
}
table{
    font-size:2em;
}
input{
    background-color:black;
    color:#00ff00;
    font-family:courier;
    font-size:1em;
}

.element{
    text-align:center;
    font-size:2em;
    width:80%;
    margin:auto;
    display:block;
    border:solid;

    border-radius:0.5em;
    border-width:0.1em;
    margin-top:1em;
    margin-bottom:0.5em;
    overflow-x:scroll;

}
#title {
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: clamp(1.5em, 5vw, 3em);
}
#feed-link{
  position: absolute;
  border:solid;
  font-size:1em;
  border-radius:10px;
  padding-left:1em;
  padding-right:1em;
  cursor:pointer;
  top: 10px;
  left: 25%;
  font-size: clamp(1.5em, 5vw, 3em);
    
}
#stack-link{
  position: absolute;
  border:solid;
  display:none;
  font-size:1em;
  border-radius:10px;
  padding-left:1em;
  padding-right:1em;
  cursor:pointer;
  top: 10px;
  left: 50%;
  font-size: clamp(1.5em, 5vw, 3em);
}
#qrcode {
  position: absolute;
  top: 10px;
  left: 10px;
}

#sign {
  font-family: Comic Sans MS;
  background-color: #9f8767;
  box-sizing: border-box;
  border-radius: 0.5em;
  padding: 0.5em;
  position: absolute;
    border:solid;

  top: max(180px, 25vw);
  left: 10px;
  bottom: 10px;
  right: 10px;
  display:none;
  font-size: clamp(1.2em, 4vw, 3em);
}
#feed {
  font-family: Comic Sans MS;
  background-color: #9f8767;
  box-sizing: border-box;
  border-radius: 0.5em;
  padding: 0.5em;
  position: absolute;
    border:solid;

  top: max(180px, 25vw);
  left: 10px;
  bottom: 10px;
  right: 10px;
  display:none;
  font-size: clamp(1.2em, 4vw, 3em);
    overflow:scroll;

}

#stack {
  font-family: Comic Sans MS;
  background-color: #9f8767;
  box-sizing: border-box;
  border-radius: 0.5em;
  padding: 0.5em;
  position: absolute;
  top: max(180px, 25vw);
  left: 10px;
  bottom: 10px;
  right: 10px;
  border:solid;
  font-size: clamp(1.2em, 4vw, 3em);
  overflow:scroll;
}

#feed a{
    text-align:center;
    font-size:2em;
    width:80%;
    margin:auto;
    display:block;
    border:solid;
    color:blue;
    border-radius:0.5em;
    border-width:0.1em;
    margin-top:1em;
    margin-bottom:0.5em;
    overflow-x:scroll;
    cursor:pointer;
    
}
body {
  background-color: #9f8767;
  font-family:  Comic Sans MS;
}

@media (min-width: 768px) {
  #sign {
    top: 180px;
    font-size: 3em;
  }
  #stack {
    top: 180px;
    font-size: 3em;
  }
  #feed {
    top: 180px;
    font-size: 3em;
  }
    
}
</style>
</body>
</html>
