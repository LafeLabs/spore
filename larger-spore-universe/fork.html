<body>
    <a href = "index.html">index.html</a>
    <h1>fork</h1>

    <table>
        <tr>
            <td>fork name:</td>
            <td>
                <input id = "fork">
            </td>
            <td>
                <a style = "display:none"  id = "forklink"></a>
            </td>
        </tr>
    </table>
    <div id = "directories"></div>

<script>

document.getElementById("fork").value = "";
document.getElementById("fork").select();

document.getElementById("fork").onchange = function(){
    document.getElementById("forklink").innerHTML = "click this fork link";
    document.getElementById("forklink").href = "fork.php?fork=" + this.value;
    document.getElementById("forklink").style.display = "inline";
}


directories = [];

fetch('list-directories.php')
    .then(xhr => xhr.json())
    .then(data => {
        directories = data;
        
        for (var index = 0; index < directories.length; index++) {
            var newspan = document.createElement("SPAN");
            newspan.innerHTML = directories[index];
            var newdiv = document.createElement("DIV");
            newdiv.appendChild(newspan);
            document.getElementById("directories").appendChild(newdiv);
            var deletebutton = document.createElement("SPAN");
            deletebutton.innerHTML = "DELETE FORK";
            deletebutton.className = "deletebutton";
            newdiv.appendChild(deletebutton);
            deletebutton.onclick = function(){
                deadfork = this.parentElement.getElementsByTagName("SPAN")[0].innerHTML;
                var httpc = new XMLHttpRequest();
                var url = "delete-fork.php";         
                httpc.open("POST", url, true);
                httpc.setRequestHeader("Content-Type", "application/x-www-form-urlencoded;charset=utf-8");
                httpc.send("fork=" + deadfork);//send text to deletefile.php
                this.parentNode.parentNode.removeChild(this.parentNode);
            }            
        }
    });


</script>
<style>

    color:red;
    border:solid;
    border-color:red;
