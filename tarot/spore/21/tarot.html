<script>

symbolGVM = new GVM();
hebrewGVM = new GVM();

stack  = [

symbolGlyphCanvas = document.getElementById("symbol-glyph-canvas");
hebrewGlyphCanvas = document.getElementById("hebrew-glyph-canvas");

cardIndex = 0;

document.getElementById("leftname").innerHTML = leftname[cardIndex];
document.getElementById("rightname").innerHTML = rightname[cardIndex];
document.getElementById("stackname").innerHTML = stack[cardIndex];

fetch('load-file.php?filename=hypercube.json')
    .then(xhr => xhr.text())
    .then(rawJSON => {
        symbolGVM.canvas.width = 200; 
        symbolGVM.canvas.height = 200;
        symbolGVM.canvas.x0 = 0.5 * symbolGVM.canvas.width; 
        symbolGVM.canvas.y0 = 0.5 * symbolGVM.canvas.height;
        symbolGVM.canvas.unit = 0.13 * symbolGVM.canvas.width; 
        symbolGVM.style.line0 = 1;
        symbolGVM.hypercube = JSON.parse(rawJSON);
        symbolGVM.glyph = [];
        glyphStringArray = deck[cardIndex].split(",");
        for(let index = 0;index < glyphStringArray.length;index++){
            if(glyphStringArray[index].length > 1){
                symbolGVM.glyph.push(parseInt(glyphStringArray[index],8));
            }
        }
        drawGlyph(symbolGlyphCanvas, symbolGVM);

        hebrewGVM.canvas.width = 200; 
        hebrewGVM.canvas.height = 200;
        hebrewGVM.canvas.x0 = 0.5 * hebrewGVM.canvas.width; 
        hebrewGVM.canvas.y0 = 0.5 * hebrewGVM.canvas.height;
        hebrewGVM.canvas.unit = 0.12 * hebrewGVM.canvas.width; 
        hebrewGVM.style.line0 = 1;
        hebrewGVM.hypercube = JSON.parse(rawJSON);
        hebrewGVM.glyph = [];
        glyphStringArray = hebrewicons[cardIndex].split(",");
        for(let index = 0;index < glyphStringArray.length;index++){
            if(glyphStringArray[index].length > 1){
                hebrewGVM.glyph.push(parseInt(glyphStringArray[index],8));
            }
        }
        drawGlyph(hebrewGlyphCanvas, hebrewGVM);


});

});
