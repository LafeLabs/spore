    <canvas id = "hebrew-glyph-canvas"></canvas>
    <div id = "qrcode"></div>
    <div id = "leftname"></div>
    <div id = "rightname"></div>
    <div id = "stackname"></div>
    <div id = "hebrewname"></div>
<style>
body{
    overflow:hidden;
    width:400px;
    height:600px;
}
#code{
    position:absolute;
    top:300px;
    bottom:200px;
    left:0px;
    right:0px;
}
#hebrewname{
    position:absolute;
    left:3px;
    top:3px;
    font-family:arial;
    font-size:16px;
}
#leftname{
    position:absolute;
    right:3px;
    top:3px;
    font-family:arial;
    font-size:16px;
    
}
#stackname{
    position:absolute;
    width:100%;
    left:0px;
    text-align:center;
    top:160px;
    font-family:arial;
    font-size:36px;
}
#rightname{
    position:absolute;
    width:100%;
    left:0px;
    text-align:center;
    bottom:10px;
    font-family:arial;
    font-size:36px;
}
#symbol-glyph-canvas{
    position:absolute;
    right:0px;
    top:0px;
    width:160px;
    height:160px;
}    
#hebrew-glyph-canvas{
    position:absolute;
    left:0px;
    top:0px;
    width:160px;
    height:160px;
}    
#qrcode{
    position:absolute;
    left:130px;
    top:10px;
}
</style>    
<script>

cardIndex = 14;
url = "https://github.com/LafeLabs/spore/tree/main/tarot/spore/14";

symbolGVM = new GVM();
hebrewGVM = new GVM();

stack  = [
"CARDBOARD",
"linux/apache/php",
"html/css/javascript/json/markdown/text",
"spore.json",
"meta-spore.php",
"spore.php",
"load-file.php",
"save-file.php",
"list-files.php",
"list-directories.php",
"fork.php",
"delete-file.php",
"delete-fork.php",
"fork.html",
"editor.html",
"index.html",
"readme.html",
"qrcode.html",
"README.md",
"showdown.js",
"qrcode.js",
"ace.js",
];

symbolGlyphCanvas = document.getElementById("symbol-glyph-canvas");
hebrewGlyphCanvas = document.getElementById("hebrew-glyph-canvas");



fetch('load-file.php?filename=hypercube.json')
    .then(xhr => xhr.text())
    .then(rawJSON => {
        hebrewGVM.hypercube = JSON.parse(rawJSON);
        symbolGVM.hypercube = JSON.parse(rawJSON);
        drawGlyphs();
});

function drawGlyphs(){
    
    symbolGVM.canvas.width = 200; 
    symbolGVM.canvas.height = 200;
    symbolGVM.canvas.x0 = 0.5 * symbolGVM.canvas.width; 
    symbolGVM.canvas.y0 = 0.5 * symbolGVM.canvas.height;
    symbolGVM.canvas.unit = 0.13 * symbolGVM.canvas.width; 
    symbolGVM.style.line0 = 1;
    symbolGVM.glyph = [];
    glyphStringArray = deck[cardIndex].split(",");
    for(let index = 0;index < glyphStringArray.length;index++){
        if(glyphStringArray[index].length > 1){
            symbolGVM.glyph.push(parseInt(glyphStringArray[index],8));
        }
    }
    drawGlyph(symbolGlyphCanvas, symbolGVM);

    hebrewGVM.canvas.width = 200; 
    hebrewGVM.canvas.height = 200;
    hebrewGVM.canvas.x0 = 0.5 * hebrewGVM.canvas.width; 
    hebrewGVM.canvas.y0 = 0.5 * hebrewGVM.canvas.height;
    hebrewGVM.canvas.unit = 0.12 * hebrewGVM.canvas.width; 
    hebrewGVM.style.line0 = 1;
    hebrewGVM.glyph = [];
    glyphStringArray = hebrewicons[cardIndex].split(",");
    for(let index = 0;index < glyphStringArray.length;index++){
        if(glyphStringArray[index].length > 1){
            hebrewGVM.glyph.push(parseInt(glyphStringArray[index],8));
        }
    }
    drawGlyph(hebrewGlyphCanvas, hebrewGVM);
    
    
    
    document.getElementById("leftname").innerHTML = leftname[cardIndex];
    document.getElementById("rightname").innerHTML = rightname[cardIndex];
    document.getElementById("stackname").innerHTML = stack[cardIndex];
    document.getElementById("hebrewname").innerHTML = hebrewname[cardIndex];


}


codesquaresize = 120;
qrcode = new QRCode(document.getElementById("qrcode"), {
	text: url,
	width: codesquaresize,
	height: codesquaresize,
	colorDark : "#000000",
	colorLight : "#ffffff",
	correctLevel : QRCode.CorrectLevel.H
});



</script>
</body>
