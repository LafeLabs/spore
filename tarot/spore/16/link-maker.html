<!doctype html>
<html lang="en">
<head>
   <meta charset="utf-8">
   <!--
spore stack
   -->
  <link href="data:image/x-icon;base64,AAABAAEAEBAQAAEABAAoAQAAFgAAACgAAAAQAAAAIAAAAAEABAAAAAAAgAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB/3gAA//8AAPb/AAD//wAA//8AAP/7AAD/3wAA3/8AAP7/AAD//wAA//8AAP93AADv/wAA//8AAP//AAB+/gAA" rel="icon" type="image/x-icon">
  <title>link maker</title>  
  <script src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>   
</head>
<body>
    <a id = "linklink" href=  "links.html">links.html</a>
    <a id = "homelink" href=  "index.html">index.html</a>

    <table>
        <tr>
            <td>CREATE:</td>
            <td>
                <input id = "new-link">
            </td>
        </tr>
    </table>
    <span id = "clear">CLEAR</span>
    <div id = "links"></div>
<script>

document.getElementById("new-link").value = "";

document.getElementById("new-link").select();

document.getElementById("new-link").onchange = function(){
    let newLink = {};
    newLink.href = this.value;
    newLink.innerHTML = this.value;
    this.value = "";
    links.unshift(newLink);
    drawFeed();
    data = encodeURIComponent(JSON.stringify(links,null,"    "));
    fetch('save-file.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=utf-8' },
        body: 'data=' + data + '&filename=links.json'
    });    
    
    
}

links = [];
var httpc = new XMLHttpRequest();
httpc.onreadystatechange = function() {
    if (this.readyState == 4 && this.status == 200) {
        links = JSON.parse(this.responseText);
        drawFeed();
    }
};
httpc.open("GET", "load-file.php?filename=links.json", true);
httpc.send()


function drawFeed(){
    document.getElementById("links").innerHTML = "";
    for(let index = 0;index < links.length;index++){
        var newspan = document.createElement("SPAN");
        newspan.innerHTML = links[index].href;
        newspan.className = "link";
        newspan.name = links[index].href;
        document.getElementById("links").appendChild(newspan);
        var deleteButton = document.createElement("SPAN");
        deleteButton.innerHTML = "DESTROY";
        deleteButton.className = "destroy";
        newspan.appendChild(deleteButton);
        deleteButton.onclick = function(){
            destroyLink = this.parentElement.name; 
            let newFeed = [];
            for(let index = 0;index < links.length;index++){
                if(links[index].href != destroyLink){
                    newFeed.push(links[index]);
                }
            }
            links = newFeed;
            drawFeed();
            data = encodeURIComponent(JSON.stringify(links,null,"    "));
            fetch('save-file.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=utf-8' },
                body: 'data=' + data + '&filename=links.json'
            });
            
        }
    }
}

resetFeed = [
    {
        "href": "https://github.com/lafelabs/spore/",
        "innerHTML": "https://github.com/lafelabs/spore/"
    },
    {
        "href": "index.html",
        "innerHTML": "home"
    }
];

document.getElementById("clear").onclick = function(){
    links = structuredClone(resetFeed);
    drawFeed();
     data = encodeURIComponent(JSON.stringify(links,null,"    "));
    fetch('save-file.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=utf-8' },
        body: 'data=' + data + '&filename=links.json'
    });    
       
}

</script>
<style>
#clear{
    position:absolute;
    top:10px;
    right:10px;
    z-index:2;
    border:solid;
    padding:10px 10px 10px 10px;
    font-size:26px;
    border-radius:10px;
    cursor:pointer;
}
#clear:hover{
    background-color:#00000080;
}
#clear:active{
    background-color:#00ff0080;
}

.destroy{
    color:red;
    border:solid;
    border-color:red;
    border-width:4px;
    border-radius:10px;
    cursor:pointer;
}
.destroy:hover{
    background-color:#ff000080;
}
#homelink {
    color:blue;
    font-size:2em;
}
#linklink {
    color:blue;
    font-size:2em;
}

table{
    font-size:2em;
}
input{
    background-color:black;
    color:#00ff00;
    font-family:courier;
    font-size:1em;
}

#links {
  font-family: Comic Sans MS;
  background-color: #9f8767;
  box-sizing: border-box;
  border-radius: 0.5em;
  padding: 0.5em;
  position: absolute;
    border:solid;

  top: max(180px, 10vw);
  left: 10px;
  bottom: 10px;
  right: 10px;
  font-size: clamp(1.2em, 4vw, 3em);
    overflow:scroll;

}


.link{
    text-align:center;
    width:80%;
    margin:auto;
    display:block;
    border:solid;
    color:blue;
    border-radius:0.5em;
    border-width:0.1em;
    margin-top:1em;
    margin-bottom:0.5em;
    overflow-x:scroll;

}
body {
  background-color: #9f8767;
  font-family:  Comic Sans MS;
}

@media (min-width: 768px) {
  #sign {
    top: 180px;
    font-size: 3em;
  }
  #stack {
    top: 180px;
    font-size: 3em;
  }
  #feed {
    top: 180px;
    font-size: 3em;
  }
    
}
</style>
</body>
</html>
