<title>SCROLL EDITOR</title>
</head>
<body>
<h1 id ="scroll-title">SCROLL</h1>
<div id = "lightdarkbutton" class = "button">--> DARK MODE <--</div>
<table id = "card-table">
    <tr>
        <td>CARD INDEX:</td>
        <td>
            <input id ="card-index"/>
        </td>
    </tr>
</table>
<div class = "no-mathjax" id = "maineditor" contenteditable="true" spellcheck="false"></div>
<div class = "mathjax" id = "displayscroll"></div>

<script>

cardIndex = 0;
document.getElementById("card-index").value = cardIndex.toString();

fetch('load-file.php?filename=stack.json')
    .then(xhr => xhr.text())
    .then(rawstack => {
        stack = JSON.parse(rawstack);
        document.getElementById("scroll-title").innerHTML = stack.name[rightname[cardIndex]]+ " SCROLL";
        rawhtml = converter.makeHtml(stack.scroll[rightname[cardIndex]]);
        document.getElementById("displayscroll").innerHTML = rawhtml;
        MathJax.Hub.Typeset();//tell Mathjax to update the math
        editor.setValue(stack.scroll[rightname[cardIndex]]);
});

document.getElementById('card-index').addEventListener('keydown', (event) => {

    if (event.key === 'ArrowUp') {
        console.log('Up arrow detected!');
        cardIndex++;
        if(cardIndex > 21){
            cardIndex=0;
        }
        document.getElementById("card-index").value = cardIndex.toString();
        rawhtml = converter.makeHtml(stack.scroll[rightname[cardIndex]]);
        document.getElementById("scroll-title").innerHTML = stack.name[rightname[cardIndex]]+ " SCROLL";
        document.getElementById("displayscroll").innerHTML = rawhtml;
        MathJax.Hub.Typeset();//tell Mathjax to update the math
        editor.setValue(stack.scroll[rightname[cardIndex]]);

    } else if (event.key === 'ArrowDown') {
        console.log('Down arrow detected!');

        cardIndex--;
        if(cardIndex < 0){
            cardIndex = 21;
        }
        document.getElementById("card-index").value = cardIndex.toString();
        document.getElementById("scroll-title").innerHTML = stack.name[rightname[cardIndex]]+ " SCROLL";
        rawhtml = converter.makeHtml(stack.scroll[rightname[cardIndex]]);
        document.getElementById("displayscroll").innerHTML = rawhtml;
        MathJax.Hub.Typeset();//tell Mathjax to update the math
        editor.setValue(stack.scroll[rightname[cardIndex]]);

    }
});


document.getElementById("card-index").onchange = function(){
    cardIndex = parseInt(this.value);
    if(cardIndex >= 0 && cardIndex <= 21){
        document.getElementById("scroll-title").innerHTML = stack.name[rightname[cardIndex]]+ " SCROLL";
        rawhtml = converter.makeHtml(stack.scroll[rightname[cardIndex]]);
        document.getElementById("displayscroll").innerHTML = rawhtml;
        MathJax.Hub.Typeset();//tell Mathjax to update the math
        editor.setValue(stack.scroll[rightname[cardIndex]]);
    }
    
}


editor = ace.edit("maineditor");
editor.setTheme("ace/theme/github");
//editor.setTheme("ace/theme/vibrant_ink");
//editor.getSession().setMode("ace/mode/html");
editor.getSession().setMode("ace/mode/markdown");

editor.getSession().setUseWrapMode(true);
editor.$blockScrolling = Infinity;

var converter = new showdown.Converter();
// for more on options see here:
// https://github.com/showdownjs/showdown/wiki/Showdown-Options
converter.setOption('literalMidWordUnderscores', 'true');
converter.setOption('tables', 'true')

document.getElementById("maineditor").onkeyup = function(){
    stack.scroll[rightname[cardIndex]] = editor.getSession().getValue();
    data = encodeURIComponent(JSON.stringify(stack,null,"    "));
    fetch('save-file.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=utf-8' },
        body: 'data=' + data + '&filename=stack.json'
    });    
    

    let readme = "# [" + stack.name[rightname[cardIndex]] + "]("  + stack.link[rightname[cardIndex]] +")\n\n";
    readme += "![](" + stack.image[rightname[cardIndex]] + ")\n\n";
    readme += "# [" + rightname[cardIndex] + "](" + cardlinks[cardIndex] + ")\n\n";
    readme += "![](" + cardimages[cardIndex] + ")\n\n";
    readme += "# Scroll\n\n\n";
    readme += stack.scroll[rightname[cardIndex]];

    data = encodeURIComponent(readme);
    fetch('save-file.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=utf-8' },
        body: 'data=' + data + '&filename=' + cardIndex.toString() + "/README.md"
    });        
    
}


lightmode = true;
document.getElementById("lightdarkbutton").style.color = "black";
document.getElementById("lightdarkbutton").style.borderColor = "black";

document.getElementById("displayscroll").style.backgroundColor = "white";
document.getElementById("displayscroll").style.color = "black";        
document.getElementById("lightdarkbutton").innerHTML = "DARK MODE";
editor.setTheme("ace/theme/github");

var links = document.getElementById("displayscroll").getElementsByTagName("a");
for(var index = 0;index < links.length;index++){
    links[index].style.color = "blue";
}

document.getElementById("lightdarkbutton").onclick = function(){
    lightmode = !lightmode;
    if(lightmode){
        document.getElementById("lightdarkbutton").style.color = "black";
        document.getElementById("lightdarkbutton").style.borderColor = "black";
        document.getElementById("lightdarkbutton").style.backgroundColor = "white";
        document.getElementById("displayscroll").style.backgroundColor = "white";
        document.getElementById("displayscroll").style.color = "black";        
        document.getElementById("lightdarkbutton").innerHTML = "DARK MODE";
        editor.setTheme("ace/theme/github");
        var links = document.getElementById("displayscroll").getElementsByTagName("a");
        for(var index = 0;index < links.length;index++){
            links[index].style.color = "blue";
        }
    }
    else{
        
        document.getElementById("lightdarkbutton").style.color = "white";
        document.getElementById("lightdarkbutton").style.borderColor = "white";
        document.getElementById("lightdarkbutton").style.backgroundColor = "#101010";
        document.getElementById("displayscroll").style.backgroundColor = "#101010";        
        document.getElementById("displayscroll").style.color = "white";        
        document.getElementById("lightdarkbutton").innerHTML = "LIGHT MODE";        
        editor.setTheme("ace/theme/vibrant_ink");

        var links = document.getElementById("displayscroll").getElementsByTagName("a");
        for(var index = 0;index < links.length;index++){
            links[index].style.color = "#ff2cb4";
        }        
    }
}

</script>
<style>

    overflow:hidden;
    font-family:Arial;
