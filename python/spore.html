<!doctype html>
<html lang="en">
<head>

<link href="data:image/x-icon;base64,AAABAAEAEBAQAAEABAAoAQAAFgAAACgAAAAQAAAAIAAAAAEABAAAAAAAgAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAZ4efAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAEREREREREREREREREREREREAAAAAAAAREQEREREREBERAREREREQEREBEAAAARAREQEQEREBEBERARAQAQEQEREBEBABARAREQEQEREBEBERARAAAAEQEREBERERERAREQEREREREBERAAAAAAAAEREREREREREREREREREREREAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" rel="icon" type="image/x-icon">

<META NAME="robots" CONTENT="noindex,nofollow">
<script src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src = "spore.js"></script>
</head>
<body>
    <div id = "qrcode"></div>
    <a style = "color:#ff2cb4; background-color:black; font-family:courier; position:absolute; left:25%; top:1em; z-index:666; font-size:3em;" href= "https://github.com/lafelabs/spore/">/spore/</a>
    <h1 id = "title">[DOMAIN].[TLD]</h1>
    <textarea id = "wall"></textarea>
    
<script>

codesquaresize = 150;
qrcode = new QRCode(document.getElementById("qrcode"), {
	text: window.location.href,
	width: codesquaresize,
	height: codesquaresize,
	colorDark : "#000000",
	colorLight : "#ffffff",
	correctLevel : QRCode.CorrectLevel.H
});


load_file('wall.txt').then(
    wall => {
        document.getElementById("wall").value = wall;
    }
);

load_file('spore.json').then(
    spore_text => {
        spore = JSON.parse(spore_text);
        list_files().then(files => {
            spore.files = files;
            
        });
    }
);


document.getElementById("wall").onkeyup = function() {
    
    wall = this.value;
    data = encodeURIComponent(this.value);
    save_file("wall.txt",data);
    
}




</script>
<style>
#title {
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: clamp(1.5em, 5vw, 3em);
}

#qrcode {
  position: absolute;
  top: 10px;
  left: 10px;
}

#wall {
  font-family: Comic Sans MS;
  background-color: #9f8767;
  box-sizing: border-box;
  border-radius: 0.5em;
  padding: 0.5em;
  position: absolute;
  top: max(180px, 25vw);
  left: 10px;
  bottom: 10px;
  right: 10px;
  font-size: clamp(1.2em, 4vw, 3em);
}

body {
  background-color: #9f8767;
  font-family:  Comic Sans MS;
}

@media (min-width: 768px) {
  #wall {
    top: 180px;
    font-size: 3em;
  }
}



</style>
</body>
