<title>spore code editor</title>
</head>
<body>

<a href=  "index.html" style = "position:absolute;right:5px;top:5px;font-size:2em;font-family:Arial;z-index:2">HOME</a>

<h1 id = "title">spore.json</h1>

<div id="maineditor" contenteditable="true" spellcheck="false"></div>

<script>


editor = ace.edit("maineditor");
editor.setTheme("ace/theme/github");
editor.getSession().setMode("ace/mode/json");
editor.getSession().setUseWrapMode(true);
editor.$blockScrolling = Infinity;
editor.setOption("useWorker", false);

currentFile = "spore.json";

load_file(currentFile).then(
    filedata => {
        setMode();
        editor.setValue(filedata);
    }
);

document.getElementById("maineditor").onkeyup = function(){
    data = editor.getSession().getValue();
    save_file(currentFile,data);
}



function setMode() {
  // Extract everything after the last dot, converted to lowercase
  const ext = currentFile.slice(currentFile.lastIndexOf('.')).toLowerCase();

  // Define a map of extensions to Ace Editor modes
  const modeMap = {
    '.py': 'python',
    '.txt': 'text',
    '.md': 'markdown',
    '.tex': 'latex',
    '.js': 'javascript',
    '.ino': 'java',
    '.css': 'css',
    '.php': 'php',
    '.html': 'html',
    '.json': 'json',
    '.bat': 'batchfile',
    '.sh': 'sh'
  };

  // Look up the mode, defaulting to 'text' if the extension isn't found
  const mode = modeMap[ext] || 'text';
  
  editor.getSession().setMode(`ace/mode/${mode}`);
}



</script>
<style>
