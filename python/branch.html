    <h1>branch</h1>

    <table>
        <tr>
            <td>branch name:</td>
            <td>
                <input id = "branch">
            </td>
            <td>
                <a style = "display:none"  id = "branchlink"></a>
            </td>
        </tr>
    </table>
    <div id = "directories"></div>
    <div id = "links"></div>

<script>
deleteMode = false;

document.getElementById("branch").value = "";
document.getElementById("branch").select();

document.getElementById("branch").onchange = function(){
    document.getElementById("branchlink").innerHTML = "click this branch link";
    document.getElementById("branchlink").href = "create-branch.php?branch=" + this.value;
    document.getElementById("branchlink").style.display = "inline";
}

directories = [];

list_branches().then(directories => {
    for (var index = 0; index < directories.length; index++) {
        var newa = document.createElement("A");
        newa.innerHTML = directories[index];
        newa.href = directories[index] + "/";
        document.getElementById("links").appendChild(newa);
        var newspan = document.createElement("SPAN");
        newspan.innerHTML = directories[index];
        var newdiv = document.createElement("DIV");
        newdiv.appendChild(newspan);
        document.getElementById("directories").appendChild(newdiv);
        if(deleteMode){
            var deletebutton = document.createElement("SPAN");
            deletebutton.innerHTML = "DELETE BRANCH";
            deletebutton.className = "deletebutton";
            newdiv.appendChild(deletebutton);
            deletebutton.onclick = function(){
                deadbranch = this.parentElement.getElementsByTagName("SPAN")[0].innerHTML;
                var httpc = new XMLHttpRequest();
                var url = "delete-branch.php";         
                httpc.open("POST", url, true);
                httpc.setRequestHeader("Content-Type", "application/x-www-form-urlencoded;charset=utf-8");
                httpc.send("branch=" + deadbranch);//send text to deletefile.php
                this.parentNode.parentNode.removeChild(this.parentNode);
            }           
        }
    }
});

</script>
